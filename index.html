<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlimeVR Toe Rig Support for VCC</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #b0b0c0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        window.onload = function() {
            // Automatically try to open VCC
            window.location.href = "vcc://vpm/addRepo?url=https%3A%2F%2Fraw.githubusercontent.com%2FSebane1%2FVRCSlimeVRToeRigSupport%2Fmain%2Findex.json";
        };
    </script>
</head>
<body>
    <h1>SlimeVR Toe Rig Support</h1>
    <p>Opening VRChat Creator Companion...</p>
    <a href="vcc://vpm/addRepo?url=https%3A%2F%2Fraw.githubusercontent.com%2FSebane1%2FVRCSlimeVRToeRigSupport%2Fmain%2Findex.json" class="btn">Click here if VCC doesn't open automatically</a>
</body>
</html>
