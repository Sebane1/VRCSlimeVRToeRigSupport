name: Release VPM Package

on:
  push:
    paths:
      - 'package.json'
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Generate index.json and Zip
        run: |
          # Create zip without root subfolder
          zip -r package.zip package.json Editor/ README.md
          
          # Generate dynamic index.json
          python3 -c "
          import json, os
          with open('package.json') as f:
              pkg = json.load(f)
          version = pkg['version']
          repo = os.environ['GITHUB_REPOSITORY']
          index = {
              'name': 'Sebane\'s VRChat Packages',
              'author': 'Sebane',
              'url': f'https://github.com/{repo}/releases/latest/download/index.json',
              'id': 'com.sebane.vpm',
              'packages': {
                  pkg['name']: {
                      'versions': {
                          version: pkg
                      }
                  }
              }
          }
          index['packages'][pkg['name']]['versions'][version]['url'] = f'https://github.com/{repo}/releases/download/v{version}/package.zip'
          with open('index.json', 'w') as f:
              json.dump(index, f, indent=2)
          "

      - name: Read package.json version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            package.zip
            index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
