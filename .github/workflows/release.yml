name: Release VPM Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Auto-bump version (if triggered by tag)
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Extract version from tag (e.g. v1.0.1 -> 1.0.1)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Triggered by tag. Bumping version to $VERSION"
            
            # Switch to main to commit the bump
            git checkout main
            jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore: auto-bump version to $VERSION [skip ci]" || echo "No changes to commit"
            git push origin main
          else
            # If triggered by a normal push to main, just read the existing version
            VERSION=$(jq -r .version package.json)
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate index.json and Zip
        run: |
          # Create zip without root subfolder
          zip -r package.zip package.json Editor/ README.md
          
          # Generate dynamic index.json
          python3 -c "
          import json, os
          with open('package.json') as f:
              pkg = json.load(f)
          version = pkg['version']
          repo = os.environ['GITHUB_REPOSITORY']
          index = {
              'name': 'Sebane\'s VRChat Packages',
              'author': 'Sebane',
              'url': f'https://github.com/{repo}/releases/latest/download/index.json',
              'id': 'com.sebane.vpm',
              'packages': {
                  pkg['name']: {
                      'versions': {
                          version: pkg
                      }
                  }
              }
          }
          index['packages'][pkg['name']]['versions'][version]['url'] = f'https://github.com/{repo}/releases/download/v{version}/package.zip'
          with open('index.json', 'w') as f:
              json.dump(index, f, indent=2)
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            package.zip
            index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
