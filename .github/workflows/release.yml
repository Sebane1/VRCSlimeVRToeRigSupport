name: Release VPM Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Auto-bump version and determine prerelease
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Triggered by tag. Bumping version to $VERSION"
            
            git checkout main
            jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          else
            git checkout main
            VERSION=$(jq -r .version package.json)
          fi
          
          # Check if this is a pre-release (contains a hyphen like -alpha or -beta)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate index.json and Zip
        run: |
          # Create zip without root subfolder
          zip -r package.zip package.json Editor/ README.md
          
          # Update the local index.json file to accumulate versions
          python3 -c "
          import json, os
          with open('package.json') as f:
              pkg = json.load(f)
          version = pkg['version']
          repo = os.environ['GITHUB_REPOSITORY']
          
          # Try to load existing local index.json
          try:
              with open('index.json', 'r') as f:
                  index = json.load(f)
              if pkg['name'] not in index['packages']:
                  index['packages'][pkg['name']] = {'versions': {}}
          except Exception as e:
              index = {
                  'name': 'Sebane\'s VRChat Packages',
                  'author': 'Sebane',
                  'url': f'https://raw.githubusercontent.com/{repo}/main/index.json',
                  'id': 'com.sebane.vpm',
                  'packages': { pkg['name']: { 'versions': {} } }
              }
          
          # Inject new version
          index['packages'][pkg['name']]['versions'][version] = pkg
          index['packages'][pkg['name']]['versions'][version]['url'] = f'https://github.com/{repo}/releases/download/v{version}/package.zip'
          
          with open('index.json', 'w') as f:
              json.dump(index, f, indent=2)
          "

      - name: Commit files to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json index.json
          git commit -m "chore: auto-update index.json and version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
